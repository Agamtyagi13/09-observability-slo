# Loki 3.x single binary, filesystem storage, OTLP ingestion enabled (demo footprint).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    allow_structured_metadata: true      # required for OTLP log attributes
    retention_period: 168h
singleBinary:
  replicas: 1
  persistence: {enabled: true, size: 10Gi}
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
monitoring:
  selfMonitoring: {enabled: false, grafanaAgent: {installOperator: false}}
