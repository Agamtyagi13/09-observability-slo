# Collector gateway: 2 replicas behind one Service. App -> OTLP -> {Tempo, Loki, Prometheus scrape}.
fullnameOverride: otel-collector
mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
podDisruptionBudget:
  enabled: true
  minAvailable: 1
resources:
  requests: {cpu: 100m, memory: 200Mi}
  limits: {cpu: 500m, memory: 400Mi}
ports:
  otlp: {enabled: true, containerPort: 4317, servicePort: 4317, protocol: TCP}
  otlp-http: {enabled: true, containerPort: 4318, servicePort: 4318, protocol: TCP}
  metrics: {enabled: true, containerPort: 8888, servicePort: 8888, protocol: TCP}
  prom-exporter: {enabled: true, containerPort: 8889, servicePort: 8889, protocol: TCP}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
        http: {endpoint: "0.0.0.0:4318"}
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc:4317
      tls: {insecure: true}
      retry_on_failure: {enabled: true}
    otlphttp/loki:
      endpoint: http://loki.observability.svc:3100/otlp
      retry_on_failure: {enabled: true}
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion: {enabled: true}   # service.name -> service_name, k8s.pod.name -> k8s_pod_name
  service:
    telemetry:
      metrics: {address: "0.0.0.0:8888"}
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
