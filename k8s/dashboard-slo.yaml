datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"1 - slo:sli_error:ratio_rate30d{slo=\\\"latency\\\"}\",\n     \"legendFormat\": \"\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"id\": 4,\n   \"title\": \"Latency error budget remaining\",\n   \"type\": \"gauge\",\n   \"description\": \"\",\n   \"gridPos\": {\n    \"x\": 18,\n    \"y\": 0,\n    \"w\": 6,\n    \"h\": 4\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"slo:error_budget_remaining:ratio{slo=\\\"latency\\\"}\",\n     \"legendFormat\": \"\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"id\": 5,\n   \"title\": \"Availability burn rate (1 = on budget; page at 14.4)\",\n   \"type\": \"timeseries\",\n   \"description\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 4,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"slo:sli_error:ratio_rate5m{slo=\\\"availability\\\"} / 0.001\",\n     \"legendFormat\": \"5m\",\n     \"refId\": \"A\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"slo:sli_error:ratio_rate1h{slo=\\\"availability\\\"} / 0.001\",\n     \"legendFormat\": \"1h\",\n     \"refId\": \"B\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"slo:sli_error:ratio_rate6h{slo=\\\"availability\\\"} / 0.001\",\n     \"legendFormat\": \"6h\",\n     \"refId\": \"C\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"id\": 6,\n   \"title\": \"Latency burn rate (1 = on budget; page at 14.4)\",\n   \"type\": \"timeseries\",\n   \"description\": \"\",\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 4,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"slo:sli_error:ratio_rate5m{slo=\\\"latency\\\"} / 0.01\",\n     \"legendFormat\": \"5m\",\n     \"refId\": \"A\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"slo:sli_error:ratio_rate1h{slo=\\\"latency\\\"} / 0.01\",\n     \"legendFormat\": \"1h\",\n     \"refId\": \"B\"\n    },\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"slo:sli_error:ratio_rate6h{slo=\\\"latency\\\"} / 0.01\",\n     \"legendFormat\": \"6h\",\n     \"refId\": \"C\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   }\n  },\n  {\n   \"id\": 7,\n   \"title\": \"Request rate by route\",\n   \"type\": \"timeseries\",\n   \"description\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 12,\n    \"w\": 8,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"sum by (route) (rate(app_requests_total{service_name=\\\"shop-api\\\"}[5m]))\",\n     \"legendFormat\": \"{{route}}\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"reqps\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"id\": 8,\n   \"title\": \"p99 latency by route\",\n   \"type\": \"timeseries\",\n   \"description\": \"\",\n   \"gridPos\": {\n    \"x\": 8,\n    \"y\": 12,\n    \"w\": 8,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"histogram_quantile(0.99, sum by (le, route) (rate(app_request_duration_seconds_bucket{service_name=\\\"shop-api\\\"}[5m])))\",\n     \"legendFormat\": \"{{route}}\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"s\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"id\": 9,\n   \"title\": \"5xx ratio by pod\",\n   \"type\": \"timeseries\",\n   \"description\": \"Use this to tell a single bad pod from a fleet-wide problem.\",\n   \"gridPos\": {\n    \"x\": 16,\n    \"y\": 12,\n    \"w\": 8,\n    \"h\": 8\n   },\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"prometheus\",\n      \"uid\": \"prometheus\"\n     },\n     \"expr\": \"(sum by (k8s_pod_name) (rate(app_requests_total{service_name=\\\"shop-api\\\",code=~\\\"5..\\\"}[5m])) / sum by (k8s_pod_name) (rate(app_requests_total{service_name=\\\"shop-api\\\"}[5m]))) or (sum by (k8s_pod_name) (rate(app_requests_total{service_name=\\\"shop-api\\\"}[5m])) * 0)\",\n     \"legendFormat\": \"{{k8s_pod_name}}\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\"\n    },\n    \"overrides\": []\n   }\n  },\n  {\n   \"id\": 10,\n   \"title\": \"Error logs (click a line, then the TraceID link, to jump to the trace)\",\n   \"type\": \"logs\",\n   \"description\": \"\",\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 20,\n    \"w\": 24,\n    \"h\": 10\n   },\n   \"datasource\": {\n    \"type\": \"loki\",\n    \"uid\": \"loki\"\n   },\n   \"targets\": [\n    {\n     \"datasource\": {\n      \"type\": \"loki\",\n      \"uid\": \"loki\"\n     },\n     \"expr\": \"{service_name=\\\"shop-api\\\"} |~ \\\"(?i)fail|error|fault\\\"\",\n     \"legendFormat\": \"\",\n     \"refId\": \"A\"\n    }\n   ],\n   \"fieldConfig\": {\n    \"defaults\": {},\n    \"overrides\": []\n   },\n   \"options\": {\n    \"showTime\": true,\n    \"wrapLogMessage\": true,\n    \"sortOrder\": \"Descending\"\n   }\n  }\n ]\n}"
