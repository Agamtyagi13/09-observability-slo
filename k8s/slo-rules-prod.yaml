apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-api-slo
  namespace: observability
  labels:
    app.kubernetes.io/part-of: slo-platform
    slo-profile: prod
spec:
  groups:
  - name: shop-api-slo-recording
    interval: 30s
    rules:
    - record: slo:sli_error:ratio_rate5m
      expr: (sum(rate(app_requests_total{service_name="shop-api",route!="/healthz",code=~"5.."}[5m])) or vector(0)) / sum(rate(app_requests_total{service_name="shop-api",route!="/healthz"}[5m]))
      labels:
        service: shop-api
        slo: availability
    - record: slo:sli_error:ratio_rate30m
      expr: (sum(rate(app_requests_total{service_name="shop-api",route!="/healthz",code=~"5.."}[30m])) or vector(0)) / sum(rate(app_requests_total{service_name="shop-api",route!="/healthz"}[30m]))
      labels:
        service: shop-api
        slo: availability
    - record: slo:sli_error:ratio_rate1h
      expr: (sum(rate(app_requests_total{service_name="shop-api",route!="/healthz",code=~"5.."}[1h])) or vector(0)) / sum(rate(app_requests_total{service_name="shop-api",route!="/healthz"}[1h]))
      labels:
        service: shop-api
        slo: availability
    - record: slo:sli_error:ratio_rate2h
      expr: (sum(rate(app_requests_total{service_name="shop-api",route!="/healthz",code=~"5.."}[2h])) or vector(0)) / sum(rate(app_requests_total{service_name="shop-api",route!="/healthz"}[2h]))
      labels:
        service: shop-api
        slo: availability
    - record: slo:sli_error:ratio_rate6h
      expr: (sum(rate(app_requests_total{service_name="shop-api",route!="/healthz",code=~"5.."}[6h])) or vector(0)) / sum(rate(app_requests_total{service_name="shop-api",route!="/healthz"}[6h]))
      labels:
        service: shop-api
        slo: availability
    - record: slo:sli_error:ratio_rate1d
      expr: (sum(rate(app_requests_total{service_name="shop-api",route!="/healthz",code=~"5.."}[1d])) or vector(0)) / sum(rate(app_requests_total{service_name="shop-api",route!="/healthz"}[1d]))
      labels:
        service: shop-api
        slo: availability
    - record: slo:sli_error:ratio_rate3d
      expr: (sum(rate(app_requests_total{service_name="shop-api",route!="/healthz",code=~"5.."}[3d])) or vector(0)) / sum(rate(app_requests_total{service_name="shop-api",route!="/healthz"}[3d]))
      labels:
        service: shop-api
        slo: availability
    - record: slo:sli_error:ratio_rate30d
      expr: (sum(rate(app_requests_total{service_name="shop-api",route!="/healthz",code=~"5.."}[30d])) or vector(0)) / sum(rate(app_requests_total{service_name="shop-api",route!="/healthz"}[30d]))
      labels:
        service: shop-api
        slo: availability
    - record: slo:error_budget_remaining:ratio
      expr: 1 - (slo:sli_error:ratio_rate30d{slo="availability",service="shop-api"} / 0.001)
      labels:
        service: shop-api
        slo: availability
    - record: slo:objective:ratio
      expr: vector(0.999)
      labels:
        service: shop-api
        slo: availability
    - record: slo:sli_error:ratio_rate5m
      expr: 1 - (sum(rate(app_request_duration_seconds_bucket{service_name="shop-api",route!="/healthz",le="0.5"}[5m])) / sum(rate(app_request_duration_seconds_count{service_name="shop-api",route!="/healthz"}[5m])))
      labels:
        service: shop-api
        slo: latency
    - record: slo:sli_error:ratio_rate30m
      expr: 1 - (sum(rate(app_request_duration_seconds_bucket{service_name="shop-api",route!="/healthz",le="0.5"}[30m])) / sum(rate(app_request_duration_seconds_count{service_name="shop-api",route!="/healthz"}[30m])))
      labels:
        service: shop-api
        slo: latency
    - record: slo:sli_error:ratio_rate1h
      expr: 1 - (sum(rate(app_request_duration_seconds_bucket{service_name="shop-api",route!="/healthz",le="0.5"}[1h])) / sum(rate(app_request_duration_seconds_count{service_name="shop-api",route!="/healthz"}[1h])))
      labels:
        service: shop-api
        slo: latency
    - record: slo:sli_error:ratio_rate2h
      expr: 1 - (sum(rate(app_request_duration_seconds_bucket{service_name="shop-api",route!="/healthz",le="0.5"}[2h])) / sum(rate(app_request_duration_seconds_count{service_name="shop-api",route!="/healthz"}[2h])))
      labels:
        service: shop-api
        slo: latency
    - record: slo:sli_error:ratio_rate6h
      expr: 1 - (sum(rate(app_request_duration_seconds_bucket{service_name="shop-api",route!="/healthz",le="0.5"}[6h])) / sum(rate(app_request_duration_seconds_count{service_name="shop-api",route!="/healthz"}[6h])))
      labels:
        service: shop-api
        slo: latency
    - record: slo:sli_error:ratio_rate1d
      expr: 1 - (sum(rate(app_request_duration_seconds_bucket{service_name="shop-api",route!="/healthz",le="0.5"}[1d])) / sum(rate(app_request_duration_seconds_count{service_name="shop-api",route!="/healthz"}[1d])))
      labels:
        service: shop-api
        slo: latency
    - record: slo:sli_error:ratio_rate3d
      expr: 1 - (sum(rate(app_request_duration_seconds_bucket{service_name="shop-api",route!="/healthz",le="0.5"}[3d])) / sum(rate(app_request_duration_seconds_count{service_name="shop-api",route!="/healthz"}[3d])))
      labels:
        service: shop-api
        slo: latency
    - record: slo:sli_error:ratio_rate30d
      expr: 1 - (sum(rate(app_request_duration_seconds_bucket{service_name="shop-api",route!="/healthz",le="0.5"}[30d])) / sum(rate(app_request_duration_seconds_count{service_name="shop-api",route!="/healthz"}[30d])))
      labels:
        service: shop-api
        slo: latency
    - record: slo:error_budget_remaining:ratio
      expr: 1 - (slo:sli_error:ratio_rate30d{slo="latency",service="shop-api"} / 0.01)
      labels:
        service: shop-api
        slo: latency
    - record: slo:objective:ratio
      expr: vector(0.99)
      labels:
        service: shop-api
        slo: latency
  - name: shop-api-slo-alerts
    rules:
    - alert: ShopApiAvailabilityFastBurn
      expr: slo:sli_error:ratio_rate1h{slo="availability",service="shop-api"} > 0.0144 and slo:sli_error:ratio_rate5m{slo="availability",service="shop-api"} > 0.0144
      for: 2m
      labels:
        severity: page
        slo: availability
        service: shop-api
        burn_window: 1h/5m
      annotations:
        summary: shop-api availability SLO burning 14.4x budget (1h and 5m windows)
        description: Share of requests that do not fail with a 5xx. Error ratio exceeds 1.4400% (14.4x the allowed 0.100%) over both 1h and 5m. At this rate the 30d budget is gone in 2.1 days.
        runbook_url: runbooks/slo-burn.md#availability-fast-burn
        dashboard: Grafana > Shop API SLOs
    - alert: ShopApiAvailabilityFastBurn
      expr: slo:sli_error:ratio_rate6h{slo="availability",service="shop-api"} > 0.006 and slo:sli_error:ratio_rate30m{slo="availability",service="shop-api"} > 0.006
      for: 2m
      labels:
        severity: page
        slo: availability
        service: shop-api
        burn_window: 6h/30m
      annotations:
        summary: shop-api availability SLO burning 6.0x budget (6h and 30m windows)
        description: Share of requests that do not fail with a 5xx. Error ratio exceeds 0.6000% (6.0x the allowed 0.100%) over both 6h and 30m. At this rate the 30d budget is gone in 5.0 days.
        runbook_url: runbooks/slo-burn.md#availability-fast-burn
        dashboard: Grafana > Shop API SLOs
    - alert: ShopApiAvailabilitySlowBurn
      expr: slo:sli_error:ratio_rate1d{slo="availability",service="shop-api"} > 0.003 and slo:sli_error:ratio_rate2h{slo="availability",service="shop-api"} > 0.003
      for: 15m
      labels:
        severity: ticket
        slo: availability
        service: shop-api
        burn_window: 1d/2h
      annotations:
        summary: shop-api availability SLO burning 3.0x budget (1d and 2h windows)
        description: Share of requests that do not fail with a 5xx. Error ratio exceeds 0.3000% (3.0x the allowed 0.100%) over both 1d and 2h. At this rate the 30d budget is gone in 10.0 days.
        runbook_url: runbooks/slo-burn.md#availability-slow-burn
        dashboard: Grafana > Shop API SLOs
    - alert: ShopApiAvailabilitySlowBurn
      expr: slo:sli_error:ratio_rate3d{slo="availability",service="shop-api"} > 0.001 and slo:sli_error:ratio_rate6h{slo="availability",service="shop-api"} > 0.001
      for: 15m
      labels:
        severity: ticket
        slo: availability
        service: shop-api
        burn_window: 3d/6h
      annotations:
        summary: shop-api availability SLO burning 1.0x budget (3d and 6h windows)
        description: Share of requests that do not fail with a 5xx. Error ratio exceeds 0.1000% (1.0x the allowed 0.100%) over both 3d and 6h. At this rate the 30d budget is gone in 30.0 days.
        runbook_url: runbooks/slo-burn.md#availability-slow-burn
        dashboard: Grafana > Shop API SLOs
    - alert: ShopApiLatencyFastBurn
      expr: slo:sli_error:ratio_rate1h{slo="latency",service="shop-api"} > 0.144 and slo:sli_error:ratio_rate5m{slo="latency",service="shop-api"} > 0.144
      for: 2m
      labels:
        severity: page
        slo: latency
        service: shop-api
        burn_window: 1h/5m
      annotations:
        summary: shop-api latency SLO burning 14.4x budget (1h and 5m windows)
        description: Share of requests served in under 500 ms. Error ratio exceeds 14.4000% (14.4x the allowed 1.000%) over both 1h and 5m. At this rate the 30d budget is gone in 2.1 days.
        runbook_url: runbooks/slo-burn.md#latency-fast-burn
        dashboard: Grafana > Shop API SLOs
    - alert: ShopApiLatencyFastBurn
      expr: slo:sli_error:ratio_rate6h{slo="latency",service="shop-api"} > 0.06 and slo:sli_error:ratio_rate30m{slo="latency",service="shop-api"} > 0.06
      for: 2m
      labels:
        severity: page
        slo: latency
        service: shop-api
        burn_window: 6h/30m
      annotations:
        summary: shop-api latency SLO burning 6.0x budget (6h and 30m windows)
        description: Share of requests served in under 500 ms. Error ratio exceeds 6.0000% (6.0x the allowed 1.000%) over both 6h and 30m. At this rate the 30d budget is gone in 5.0 days.
        runbook_url: runbooks/slo-burn.md#latency-fast-burn
        dashboard: Grafana > Shop API SLOs
    - alert: ShopApiLatencySlowBurn
      expr: slo:sli_error:ratio_rate1d{slo="latency",service="shop-api"} > 0.03 and slo:sli_error:ratio_rate2h{slo="latency",service="shop-api"} > 0.03
      for: 15m
      labels:
        severity: ticket
        slo: latency
        service: shop-api
        burn_window: 1d/2h
      annotations:
        summary: shop-api latency SLO burning 3.0x budget (1d and 2h windows)
        description: Share of requests served in under 500 ms. Error ratio exceeds 3.0000% (3.0x the allowed 1.000%) over both 1d and 2h. At this rate the 30d budget is gone in 10.0 days.
        runbook_url: runbooks/slo-burn.md#latency-slow-burn
        dashboard: Grafana > Shop API SLOs
    - alert: ShopApiLatencySlowBurn
      expr: slo:sli_error:ratio_rate3d{slo="latency",service="shop-api"} > 0.01 and slo:sli_error:ratio_rate6h{slo="latency",service="shop-api"} > 0.01
      for: 15m
      labels:
        severity: ticket
        slo: latency
        service: shop-api
        burn_window: 3d/6h
      annotations:
        summary: shop-api latency SLO burning 1.0x budget (3d and 6h windows)
        description: Share of requests served in under 500 ms. Error ratio exceeds 1.0000% (1.0x the allowed 1.000%) over both 3d and 6h. At this rate the 30d budget is gone in 30.0 days.
        runbook_url: runbooks/slo-burn.md#latency-slow-burn
        dashboard: Grafana > Shop API SLOs
